[package]
name = "search-confirmation"
version = "0.1.0"
edition = "2021"

[dependencies]
traffic-sim = { path = "/workspace/traffic/crates/sim" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = true

